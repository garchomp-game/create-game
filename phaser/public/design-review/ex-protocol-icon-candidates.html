<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Core 固有スキル アイコン比較</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, "Noto Sans JP", sans-serif;
        background: #0b1016;
        color: #e5edf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        width: min(1120px, 100%);
        margin: 0 auto;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      .lead {
        margin-top: 8px;
        color: #aab8c6;
      }

      .legend {
        display: flex;
        gap: 18px;
        margin: 24px 0 14px;
        color: #aab8c6;
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .card {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) repeat(3, auto);
        align-items: center;
        gap: 18px;
        min-height: 104px;
        padding: 16px;
        border: 1px solid #344454;
        border-left: 4px solid var(--accent);
        border-radius: 6px;
        background: #121a23;
      }

      .card[data-state="selected"] {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, #121a23);
      }

      .card[data-state="active"] {
        outline: 2px solid #facc15;
        outline-offset: 2px;
      }

      .pulse {
        --accent: #22b8cf;
      }

      .spread {
        --accent: #fbbf24;
      }

      .name {
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }

      .meaning {
        margin-top: 4px;
        color: #aab8c6;
        font-size: 12px;
        line-height: 1.5;
      }

      .candidate {
        display: grid;
        justify-items: center;
        gap: 5px;
        min-width: 50px;
        color: var(--accent);
      }

      .candidate strong {
        color: #aab8c6;
        font-size: 10px;
      }

      svg {
        width: var(--size);
        height: var(--size);
      }

      .sizes {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .sizes svg:nth-of-type(1) {
        --size: 16px;
      }

      .sizes svg:nth-of-type(2) {
        --size: 20px;
      }

      .sizes svg:nth-of-type(3) {
        --size: 24px;
      }

      .mono {
        filter: grayscale(1);
      }

      @media (max-width: 820px) {
        body {
          padding: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          grid-template-columns: minmax(130px, 1fr) repeat(2, auto);
        }

        .mono {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>固有スキル アイコン比較</h1>
      <p class="lead">
        A案を選択UIへ仮採用。16 / 20 / 24px、単色、選択・フォーカス状態で識別できるかを比較する。
      </p>
      <div class="legend">
        <span>通常: 上段</span>
        <span>選択: 中段</span>
        <span>操作対象: 下段</span>
      </div>
      <section class="grid" id="icon-grid"></section>
    </main>
    <script>
      const skills = [
        ["pulse", "pulse-resonance-relay", "交差導線", "2地点を結ぶ連鎖"],
        ["pulse", "pulse-rebound-overdrive", "反跳過給", "壁反射で弾を再加速"],
        ["pulse", "pulse-redline-core", "赤熱炉心", "HPを代償に集中火力"],
        ["spread", "spread-full-span-tidal-sweep", "全幅潮汐掃討", "広い扇形の一斉掃射"],
        ["spread", "spread-breakwater-fan", "防波扇", "前方を押し戻す防波"],
        ["spread", "spread-aegis-fan", "護壁扇", "外縁弾で敵弾を防ぐ"],
      ];
      const states = ["normal", "selected", "active"];
      const grid = document.querySelector("#icon-grid");

      for (const [weapon, id, name, meaning] of skills) {
        for (const state of states) {
          const card = document.createElement("article");
          card.className = `card ${weapon}`;
          card.dataset.state = state;
          card.innerHTML = `
            <div>
              <div class="name">${name}</div>
              <div class="meaning">${meaning} / ${state}</div>
            </div>
            ${candidate(id, "A", false)}
            ${candidate(id, "B", false)}
            ${candidate(id, "A", true)}
          `;
          grid.append(card);
        }
      }

      function candidate(id, variant, mono) {
        const symbol = `${id}-${variant.toLowerCase()}`;
        return `
          <div class="candidate ${mono ? "mono" : ""}">
            <strong>${mono ? `${variant} 白黒` : `${variant}案`}</strong>
            <span class="sizes">
              ${icon(symbol)}
              ${icon(symbol)}
              ${icon(symbol)}
            </span>
          </div>
        `;
      }

      function icon(symbol) {
        return `<svg viewBox="0 0 24 24" aria-label="${symbol}"><use href="/assets/ex-protocol-icons.svg#${symbol}"></use></svg>`;
      }
    </script>
  </body>
</html>
